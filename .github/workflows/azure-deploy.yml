name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ENVIRONMENT: prod
  UNIQUE_SUFFIX: ec1

jobs:
  # -- 1. Provision Azure infrastructure --------------------------------------
  provision:
    runs-on: ubuntu-latest
    outputs:
      acr_login_server: ${{ steps.bicep.outputs.acr_login_server }}
      acr_name: ${{ steps.bicep.outputs.acr_name }}
      app_name: ${{ steps.bicep.outputs.app_name }}
      app_hostname: ${{ steps.bicep.outputs.app_hostname }}
      kv_name: ${{ steps.bicep.outputs.kv_name }}

    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --location southeastasia \
            --output none

      - name: Get service principal object ID
        id: sp
        run: |
          CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.clientId')
          OID=$(az ad sp show --id "$CLIENT_ID" --query id -o tsv)
          echo "oid=$OID" >> "$GITHUB_OUTPUT"

      - name: Deploy Bicep infrastructure
        id: bicep
        env:
          POSTGRES_PASS: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          JWT_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          OUT=$(az deployment group create \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters \
                environment=${{ env.ENVIRONMENT }} \
                uniqueSuffix=${{ env.UNIQUE_SUFFIX }} \
                postgresAdminPassword="$POSTGRES_PASS" \
                jwtSecretKey="$JWT_KEY" \
                deployPrincipalObjectId="${{ steps.sp.outputs.oid }}" \
            --query "properties.outputs" \
            --output json)

          echo "acr_login_server=$(echo $OUT | jq -r '.acrLoginServer.value')" >> "$GITHUB_OUTPUT"
          echo "acr_name=$(echo $OUT | jq -r '.acrName.value')" >> "$GITHUB_OUTPUT"
          echo "app_name=$(echo $OUT | jq -r '.appName.value')" >> "$GITHUB_OUTPUT"
          echo "app_hostname=$(echo $OUT | jq -r '.appHostname.value')" >> "$GITHUB_OUTPUT"
          echo "kv_name=$(echo $OUT | jq -r '.keyVaultName.value')" >> "$GITHUB_OUTPUT"

  # -- 2. Build & push the combined frontend+backend image to ACR ------------
  build:
    needs: provision
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ needs.provision.outputs.acr_login_server }}

    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name "${{ needs.provision.outputs.acr_name }}"

      - name: Build & push app image
        run: |
          docker build -f Dockerfile \
            -t $REGISTRY/econnectone-app:${{ github.sha }} \
            -t $REGISTRY/econnectone-app:latest .
          docker push $REGISTRY/econnectone-app:${{ github.sha }}
          docker push $REGISTRY/econnectone-app:latest

  # -- 3. Run EF Core migrations -----------------------------------------------
  migrate:
    needs: [provision, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install EF Core CLI
        run: dotnet tool install dotnet-ef --tool-path "$RUNNER_TEMP/dotnet-tools" --version 10.0.11

      - name: Restore & build backend
        run: |
          dotnet restore backend/eConnectOne.API/eConnectOne.API.csproj
          dotnet build backend/eConnectOne.API/eConnectOne.API.csproj -c Release --no-restore

      - name: Apply migrations
        env:
          PG_HOST: pg-econn-${{ env.ENVIRONMENT }}-${{ env.UNIQUE_SUFFIX }}.postgres.database.azure.com
          PG_PASS: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          DB_CONN="Host=${PG_HOST};Port=5432;Database=eConnectOne;Username=pgadmin;Password=${PG_PASS};SSL Mode=Require"
          "$RUNNER_TEMP/dotnet-tools/dotnet-ef" database update \
            --project backend/eConnectOne.API/eConnectOne.API.csproj \
            --startup-project backend/eConnectOne.API/eConnectOne.API.csproj \
            --context ApplicationDbContext \
            --connection "$DB_CONN"

  # -- 4. Deploy to Container Apps ---------------------------------------------
  deploy:
    needs: [provision, build, migrate]
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ needs.provision.outputs.acr_login_server }}

    steps:
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR credentials
        id: acr_creds
        run: |
          ACR_USER=$(az acr credential show \
            --name "${{ needs.provision.outputs.acr_name }}" \
            --query "username" -o tsv)
          ACR_PASS=$(az acr credential show \
            --name "${{ needs.provision.outputs.acr_name }}" \
            --query "passwords[0].value" -o tsv)
          echo "::add-mask::$ACR_USER"
          echo "::add-mask::$ACR_PASS"
          echo "acr_username=$ACR_USER" >> "$GITHUB_OUTPUT"
          echo "acr_password=$ACR_PASS" >> "$GITHUB_OUTPUT"

      - name: Deploy app
        env:
          PG_HOST: pg-econn-${{ env.ENVIRONMENT }}-${{ env.UNIQUE_SUFFIX }}.postgres.database.azure.com
          PG_PASS: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          JWT_KEY: ${{ secrets.JWT_SECRET_KEY }}
          APP_HOSTNAME: ${{ needs.provision.outputs.app_hostname }}
          ACR_USERNAME: ${{ steps.acr_creds.outputs.acr_username }}
          ACR_PASSWORD: ${{ steps.acr_creds.outputs.acr_password }}
        run: |
          DB_CONN="Host=${PG_HOST};Port=5432;Database=eConnectOne;Username=pgadmin;Password=${PG_PASS};SSL Mode=Require"
          az containerapp registry set \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ needs.provision.outputs.app_name }}" \
            --server "$REGISTRY" \
            --username "$ACR_USERNAME" \
            --password "$ACR_PASSWORD"
          az containerapp update \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ needs.provision.outputs.app_name }}" \
            --image "$REGISTRY/econnectone-app:${{ github.sha }}" \
            --set-env-vars \
              "DATABASE_URL=${DB_CONN}" \
              "JWT-SECRET-KEY=${JWT_KEY}" \
              DOTNET_ENVIRONMENT=Production \
              ASPNETCORE_URLS="http://+:80" \
              "ALLOWED_HOSTS=${APP_HOSTNAME}"

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${{ needs.provision.outputs.app_hostname }}/health")
            if [ "$STATUS" = "200" ]; then
              echo "App healthy"; exit 0
            fi
            echo "Waiting... attempt $i/20 (status: $STATUS)"; sleep 15
          done
          echo "App health check failed"; exit 1

      - name: Smoke test frontend
        run: |
          HOST="https://${{ needs.provision.outputs.app_hostname }}"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HOST/")
          if [ "$STATUS" != "200" ]; then
            echo "Landing site smoke test failed (status: $STATUS)"; exit 1
          fi
          echo "Landing site OK"

      - name: Smoke test portal (/app) and its built assets
        run: |
          HOST="https://${{ needs.provision.outputs.app_hostname }}"

          # Retry loop: right after "deploy app", the new revision may still be rolling
          # out/warming up for a few seconds even though /health already returned 200
          # (health check hits the app process, not necessarily the fully-settled
          # ingress/revision routing). Poll a few times before failing the build.
          for i in $(seq 1 10); do
            APP_HTML=$(curl -s "$HOST/app/")
            APP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HOST/app/")
            ASSET_PATH=$(echo "$APP_HTML" | grep -oE '/app/assets/[A-Za-z0-9_.-]+\.js' | head -n1)

            if [ "$APP_STATUS" = "200" ] && [ -n "$ASSET_PATH" ]; then
              ASSET_CONTENT_TYPE=$(curl -s -o /dev/null -w "%{content_type}" "$HOST$ASSET_PATH")
              case "$ASSET_CONTENT_TYPE" in
                *javascript*) break ;;
              esac
            fi

            echo "Portal not ready yet, retrying... attempt $i/10"; sleep 10
          done

          if [ "$APP_STATUS" != "200" ]; then
            echo "Portal smoke test failed: /app/ returned $APP_STATUS"; exit 1
          fi
          if [ -z "$ASSET_PATH" ]; then
            echo "Portal smoke test failed: could not find a referenced JS asset in /app/ index.html"
            exit 1
          fi

          # Final confirmation with a clear failure message (redundant with the loop above,
          # but ensures a failed run always explains exactly what went wrong).
          ASSET_CONTENT_TYPE=$(curl -s -o /dev/null -w "%{content_type}" "$HOST$ASSET_PATH")
          case "$ASSET_CONTENT_TYPE" in
            *javascript*) echo "Portal JS asset OK ($ASSET_PATH -> $ASSET_CONTENT_TYPE)" ;;
            *)
              echo "Portal smoke test failed: $ASSET_PATH returned Content-Type '$ASSET_CONTENT_TYPE' (expected javascript)"
              exit 1
              ;;
          esac

          # A deliberately nonexistent file under /app/ must 404, not fall back to HTML —
          # guards against the SPA fallback route regressing to match file-like paths again.
          FAKE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HOST/app/__smoke_test_nonexistent__.js")
          if [ "$FAKE_STATUS" != "404" ]; then
            echo "Portal smoke test failed: nonexistent asset under /app/ returned $FAKE_STATUS (expected 404)"
            exit 1
          fi
          echo "Portal 404 handling OK"

      - name: Deployment summary
        run: |
          echo "### Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Service  | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| App (Frontend + API) | https://${{ needs.provision.outputs.app_hostname }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Swagger  | https://${{ needs.provision.outputs.app_hostname }}/swagger |" >> $GITHUB_STEP_SUMMARY
          echo "| Key Vault| ${{ needs.provision.outputs.kv_name }} |" >> $GITHUB_STEP_SUMMARY