name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ENVIRONMENT: prod
  UNIQUE_SUFFIX: ec1

jobs:
  # ── 1. Provision Azure infrastructure ─────────────────────────────────────
  provision:
    runs-on: ubuntu-latest
    outputs:
      acr_login_server: ${{ steps.bicep.outputs.acr_login_server }}
      acr_name: ${{ steps.bicep.outputs.acr_name }}
      backend_app_name: ${{ steps.bicep.outputs.backend_app_name }}
      frontend_app_name: ${{ steps.bicep.outputs.frontend_app_name }}
      backend_hostname: ${{ steps.bicep.outputs.backend_hostname }}
      frontend_hostname: ${{ steps.bicep.outputs.frontend_hostname }}
      kv_name: ${{ steps.bicep.outputs.kv_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --location southeastasia \
            --output none

      - name: Get service principal object ID
        id: sp
        run: |
          CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.clientId')
          OID=$(az ad sp show --id "$CLIENT_ID" --query id -o tsv)
          echo "oid=$OID" >> "$GITHUB_OUTPUT"

      - name: Deploy Bicep infrastructure
        id: bicep
        env:
          POSTGRES_PASS: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          JWT_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          OUT=$(az deployment group create \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters \
                environment=${{ env.ENVIRONMENT }} \
                uniqueSuffix=${{ env.UNIQUE_SUFFIX }} \
                postgresAdminPassword="$POSTGRES_PASS" \
                jwtSecretKey="$JWT_KEY" \
                deployPrincipalObjectId="${{ steps.sp.outputs.oid }}" \
            --query "properties.outputs" \
            --output json)

          echo "acr_login_server=$(echo $OUT | jq -r '.acrLoginServer.value')" >> "$GITHUB_OUTPUT"
          echo "acr_name=$(echo $OUT | jq -r '.acrName.value')" >> "$GITHUB_OUTPUT"
          echo "backend_app_name=$(echo $OUT | jq -r '.backendAppName.value')" >> "$GITHUB_OUTPUT"
          echo "frontend_app_name=$(echo $OUT | jq -r '.frontendAppName.value')" >> "$GITHUB_OUTPUT"
          echo "backend_hostname=$(echo $OUT | jq -r '.backendHostname.value')" >> "$GITHUB_OUTPUT"
          echo "frontend_hostname=$(echo $OUT | jq -r '.frontendHostname.value')" >> "$GITHUB_OUTPUT"
          echo "kv_name=$(echo $OUT | jq -r '.keyVaultName.value')" >> "$GITHUB_OUTPUT"

  # ── 2. Build & push images to ACR ─────────────────────────────────────────
  build:
    needs: provision
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ needs.provision.outputs.acr_login_server }}

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name "${{ needs.provision.outputs.acr_name }}"

      - name: Build & push backend image
        run: |
          docker build -f Dockerfile \
            -t $REGISTRY/econnectone-backend:${{ github.sha }} \
            -t $REGISTRY/econnectone-backend:latest .
          docker push $REGISTRY/econnectone-backend:${{ github.sha }}
          docker push $REGISTRY/econnectone-backend:latest

      - name: Build & push frontend image
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_BASE_URL="https://${{ needs.provision.outputs.backend_hostname }}/api" \
            -t $REGISTRY/econnectone-frontend:${{ github.sha }} \
            -t $REGISTRY/econnectone-frontend:latest ./frontend
          docker push $REGISTRY/econnectone-frontend:${{ github.sha }}
          docker push $REGISTRY/econnectone-frontend:latest

  # ── 3. Run EF Core migrations ──────────────────────────────────────────────
  migrate:
    needs: [provision, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install EF Core CLI
        run: dotnet tool install dotnet-ef --tool-path "$RUNNER_TEMP/dotnet-tools" --version 9.0.8

      - name: Restore & build backend
        run: |
          dotnet restore backend/eConnectOne.API/eConnectOne.API.csproj
          dotnet build backend/eConnectOne.API/eConnectOne.API.csproj -c Release --no-restore

      - name: Apply migrations
        env:
          PG_HOST: pg-econn-${{ env.ENVIRONMENT }}-${{ env.UNIQUE_SUFFIX }}.postgres.database.azure.com
          PG_PASS: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          DB_CONN="Host=${PG_HOST};Port=5432;Database=eConnectOne;Username=pgadmin;Password=${PG_PASS};SSL Mode=Require"
          "$RUNNER_TEMP/dotnet-tools/dotnet-ef" database update \
            --project backend/eConnectOne.API/eConnectOne.API.csproj \
            --startup-project backend/eConnectOne.API/eConnectOne.API.csproj \
            --context ApplicationDbContext \
            --connection "$DB_CONN"

  # ── 4. Deploy to Container Apps ────────────────────────────────────────────
  deploy:
    needs: [provision, build, migrate]
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ needs.provision.outputs.acr_login_server }}

    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend
        env:
          PG_HOST: pg-econn-${{ env.ENVIRONMENT }}-${{ env.UNIQUE_SUFFIX }}.postgres.database.azure.com
          PG_PASS: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          JWT_KEY: ${{ secrets.JWT_SECRET_KEY }}
          FRONTEND_ORIGIN: https://${{ needs.provision.outputs.frontend_hostname }}
          BACKEND_HOSTNAME: ${{ needs.provision.outputs.backend_hostname }}
        run: |
          DB_CONN="Host=${PG_HOST};Port=5432;Database=eConnectOne;Username=pgadmin;Password=${PG_PASS};SSL Mode=Require"
          az containerapp update \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ needs.provision.outputs.backend_app_name }}" \
            --image "$REGISTRY/econnectone-backend:${{ github.sha }}" \
            --set-env-vars \
              "DATABASE_URL=${DB_CONN}" \
              "JWT-SECRET-KEY=${JWT_KEY}" \
              DOTNET_ENVIRONMENT=Production \
              ASPNETCORE_URLS="http://+:80" \
              "FRONTEND_ORIGIN=${FRONTEND_ORIGIN}" \
              "ALLOWED_HOSTS=${BACKEND_HOSTNAME}"

      - name: Deploy frontend
        run: |
          az containerapp update \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ needs.provision.outputs.frontend_app_name }}" \
            --image "$REGISTRY/econnectone-frontend:${{ github.sha }}"

      - name: Health check - backend
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${{ needs.provision.outputs.backend_hostname }}/health")
            if [ "$STATUS" = "200" ]; then
              echo "Backend healthy"; exit 0
            fi
            echo "Waiting... attempt $i/20 (status: $STATUS)"; sleep 15
          done
          echo "Backend health check failed"; exit 1

      - name: Health check - frontend
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${{ needs.provision.outputs.frontend_hostname }}/health")
            if [ "$STATUS" = "200" ]; then
              echo "Frontend healthy"; exit 0
            fi
            echo "Waiting... attempt $i/10 (status: $STATUS)"; sleep 10
          done
          echo "Frontend health check failed"; exit 1

      - name: Deployment summary
        run: |
          echo "### Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Service  | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | https://${{ needs.provision.outputs.frontend_hostname }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend  | https://${{ needs.provision.outputs.backend_hostname }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Swagger  | https://${{ needs.provision.outputs.backend_hostname }}/swagger |" >> $GITHUB_STEP_SUMMARY
          echo "| Key Vault| ${{ needs.provision.outputs.kv_name }} |" >> $GITHUB_STEP_SUMMARY
