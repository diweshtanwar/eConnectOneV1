name: Build and Push Frontend Image

on:
  workflow_dispatch: # disabled — azure-deploy.yml handles everything

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Extract ACR name from environment
        id: acr
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "name=creconnectoneprod" >> $GITHUB_OUTPUT
          else
            echo "name=creconnectonedev" >> $GITHUB_OUTPUT
          fi

      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ steps.acr.outputs.name }}.azurecr.io

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.acr.outputs.name }}.azurecr.io/econnectone-frontend:${{ github.sha }}
            ${{ steps.acr.outputs.name }}.azurecr.io/econnectone-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image pushed: ${{ steps.acr.outputs.name }}.azurecr.io/econnectone-frontend:${{ github.sha }}"
