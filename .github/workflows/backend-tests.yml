name: Backend Tests

# Runs the eConnectOne.API.Tests suite on every push and pull request. This is
# intentionally a separate workflow from azure-deploy.yml — it does NOT gate or
# trigger deployment, it exists purely to give fast feedback (and a visible PR
# check) on backend correctness across the Master Admin / Admin / HO user / CSP
# roles before/after a change ships.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/eConnectOne.API.Tests/eConnectOne.API.Tests.csproj

      - name: Test
        run: |
          dotnet test backend/eConnectOne.API.Tests/eConnectOne.API.Tests.csproj \
            --no-restore \
            --logger "console;verbosity=normal"
