name: Deploy to Azure App Service

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'frontend/Dockerfile'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - staging
          - dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'prod' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event.inputs.environment }}" != "" ]; then
            echo "name=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "name=prod" >> $GITHUB_OUTPUT
          fi

      - name: Set ACR and resource group based on environment
        id: vars
        run: |
          if [ "${{ steps.env.outputs.name }}" == "prod" ]; then
            echo "acr_name=creconnectoneprod" >> $GITHUB_OUTPUT
            echo "rg_name=rg-econnectone-prod" >> $GITHUB_OUTPUT
            echo "backend_app=app-econnectone-api-prod" >> $GITHUB_OUTPUT
            echo "frontend_app=app-econnectone-web-prod" >> $GITHUB_OUTPUT
          elif [ "${{ steps.env.outputs.name }}" == "staging" ]; then
            echo "acr_name=creconnectonestaging" >> $GITHUB_OUTPUT
            echo "rg_name=rg-econnectone-staging" >> $GITHUB_OUTPUT
            echo "backend_app=app-econnectone-api-staging" >> $GITHUB_OUTPUT
            echo "frontend_app=app-econnectone-web-staging" >> $GITHUB_OUTPUT
          else
            echo "acr_name=creconnectonedev" >> $GITHUB_OUTPUT
            echo "rg_name=rg-econnectone-dev" >> $GITHUB_OUTPUT
            echo "backend_app=app-econnectone-api-dev" >> $GITHUB_OUTPUT
            echo "frontend_app=app-econnectone-web-dev" >> $GITHUB_OUTPUT
          fi

      - name: Deploy backend image
        run: |
          az webapp config container set \
            --resource-group ${{ steps.vars.outputs.rg_name }} \
            --name ${{ steps.vars.outputs.backend_app }} \
            --docker-custom-image-name ${{ steps.vars.outputs.acr_name }}.azurecr.io/econnectone-backend:${{ github.sha }} \
            --docker-registry-server-url https://${{ steps.vars.outputs.acr_name }}.azurecr.io

      - name: Deploy frontend image
        run: |
          az webapp config container set \
            --resource-group ${{ steps.vars.outputs.rg_name }} \
            --name ${{ steps.vars.outputs.frontend_app }} \
            --docker-custom-image-name ${{ steps.vars.outputs.acr_name }}.azurecr.io/econnectone-frontend:${{ github.sha }} \
            --docker-registry-server-url https://${{ steps.vars.outputs.acr_name }}.azurecr.io

      - name: Wait for backend to start
        run: |
          for i in {1..30}; do
            status=$(az webapp show --resource-group ${{ steps.vars.outputs.rg_name }} --name ${{ steps.vars.outputs.backend_app }} --query state -o tsv)
            if [ "$status" == "Running" ]; then
              echo "Backend is running"
              exit 0
            fi
            echo "Waiting for backend... ($status)"
            sleep 10
          done
          echo "Backend did not start in time"
          exit 1

      - name: Get Key Vault name
        id: kv
        run: |
          if [ "${{ steps.env.outputs.name }}" == "prod" ]; then
            echo "name=kv-econnectone-prod" >> $GITHUB_OUTPUT
          elif [ "${{ steps.env.outputs.name }}" == "staging" ]; then
            echo "name=kv-econnectone-staging" >> $GITHUB_OUTPUT
          else
            echo "name=kv-econnectone-dev" >> $GITHUB_OUTPUT
          fi

      - name: Run database migrations
        run: |
          connectionString=$(az keyvault secret show --vault-name ${{ steps.kv.outputs.name }} --name POSTGRES-CONNECTION-STRING --query value -o tsv)
          
          dotnet tool install --global dotnet-ef
          export PATH="$PATH:$HOME/.dotnet/tools"
          
          cd backend/eConnectOne.API
          dotnet restore
          dotnet build --configuration Release
          dotnet ef database update --connection "$connectionString"

      - name: Smoke test backend
        run: |
          backendUrl=$(az webapp show --resource-group ${{ steps.vars.outputs.rg_name }} --name ${{ steps.vars.outputs.backend_app }} --query defaultHostname -o tsv)
          curl -f "https://$backendUrl/health" || (echo "Backend health check failed" && exit 1)

      - name: Smoke test frontend
        run: |
          frontendUrl=$(az webapp show --resource-group ${{ steps.vars.outputs.rg_name }} --name ${{ steps.vars.outputs.frontend_app }} --query defaultHostname -o tsv)
          curl -f "https://$frontendUrl" || (echo "Frontend health check failed" && exit 1)

      - name: Deployment summary
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Backend:** https://${{ steps.vars.outputs.backend_app }}.azurewebsites.net" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend:** https://${{ steps.vars.outputs.frontend_app }}.azurewebsites.net" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
