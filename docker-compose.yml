services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres@123
      POSTGRES_DB: eConnectOne
    volumes:
      - 'E:/Docker/wsl/DockerDesktopWSL/econnectone/postgres:/var/lib/postgresql/data'
    ports:
      - '5432:5432'

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgresql://postgres:postgres%40123@postgres:5432/eConnectOne"
      ASPNETCORE_URLS: "http://+:10000"
      DOTNET_ENVIRONMENT: Development
    ports:
      - '10000:10000'

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    ports:
      - '5173:5173'
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=http://host.docker.internal:10000/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

