services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres@123}
      POSTGRES_DB: eConnectOne
    volumes:
      - 'E:/Docker/wsl/DockerDesktopWSL/econnectone/postgres:/var/lib/postgresql/data'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres@123}@postgres:5432/eConnectOne"
      ASPNETCORE_PORT: "80"
      DOTNET_ENVIRONMENT: Production
    ports:
      - '80:80'

